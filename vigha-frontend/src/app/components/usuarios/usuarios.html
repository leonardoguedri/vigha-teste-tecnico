<div class="container">
  <div class="header">
    <h2>Usuários Cadastrados</h2>
    <button class="btn-logout" (click)="logout()">Sair</button>
  </div>

  @if (erro) {
    <div class="erro">{{ erro }}</div>
  }
  @if (sucesso) {
    <div class="sucesso">{{ sucesso }}</div>
  }

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Criado em</th>
        <th>Ações</th>
      </tr>
    </thead>
 <tbody>
      @for (u of usuarios; track u.id) {
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.criado_em | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <button class="btn-edit" (click)="iniciarEdicao(u)">Editar</button>
            <button class="btn-delete" (click)="excluir(u.id)">Excluir</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4">Nenhum usuário encontrado</td></tr>
      }
    </tbody>
  </table>

  @if (editando) {
    <div class="modal">
      <div class="modal-box">
        <h3>Editar Usuário</h3>
        <input type="email" placeholder="Novo email" [(ngModel)]="emailEdit" />
        <input type="password" placeholder="Nova senha (opcional)" [(ngModel)]="senhaEdit" />
        <div class="modal-actions">
          <button class="btn-edit" (click)="salvarEdicao()">Salvar</button>
          <button class="btn-delete" (click)="editando = null">Cancelar</button>
        </div>
      </div>
    </div>
  }
</div>
