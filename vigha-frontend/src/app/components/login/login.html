<div class="container">
  <h2>Login</h2>

  @if (erro) {
    <div class="erro">{{ erro }}</div>
  }

  <input type="email" placeholder="Email" [(ngModel)]="email" />
  <input type="password" placeholder="Senha" [(ngModel)]="senha" />

  <button (click)="entrar()">Entrar</button>

  <div class="divisor">
    <span>ou</span>
  </div>

  <button class="btn-google" (click)="loginGoogle()">
    Entrar com Google
  </button>

  <p>Não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
</div>
